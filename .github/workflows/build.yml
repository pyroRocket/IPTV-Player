name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # One APK that runs on every Fire TV, Android TV and phone.
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk IPTV-Player-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-android
          path: IPTV-Player-android.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      # Ship the Visual C++ runtime next to the app so it starts on PCs without it.
      - name: Bundle VC++ runtime
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build/windows/x64/runner/Release/
          }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath IPTV-Player-windows.zip
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $env:Path += ';C:\Program Files (x86)\Inno Setup 6'
          }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ';C:\Program Files (x86)\Inno Setup 6'
          }
          iscc /DAppVersion=$version windows/installer/installer.iss
          Move-Item dist/IPTV-Player-windows-setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-windows
          path: |
            IPTV-Player-windows-setup.exe
            IPTV-Player-windows.zip

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/IPTV Player.app" IPTV-Player-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-macos
          path: IPTV-Player-macos.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            IPTV-Player-android.apk
            IPTV-Player-windows-setup.exe
            IPTV-Player-windows.zip
            IPTV-Player-macos.zip
